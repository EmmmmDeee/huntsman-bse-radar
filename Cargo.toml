[package]
name = "huntsman-bse-radar"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Termux adapter: Huntsman Search Engine entities from BLE Radar (bleradar-core) sweep rules"
license = "MIT"
publish = false
default-run = "hse-radar"

[[bin]]
name = "hse-radar"
path = "src/main.rs"

[lib]
name = "huntsman_bse_radar"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
bleradar-core = { path = "vendor/bleradar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = true
